name: 一次性 · 删除全部 Cloudflare 资源

# ⚠️⚠️⚠️ 不可逆删除 ⚠️⚠️⚠️
# 本 workflow 会永久删除账号下的 Cloudflare 项目：
#   - Pages 项目（含所有部署与自定义域名）
#   - Workers 脚本
#   - KV 命名空间 / R2 bucket / D1 数据库
# 删除后无法恢复，域名（kaka-m3u.pages.dev 等）立即失效。
#
# 仅手动触发时执行，且需在 inputs 中输入 CONFIRM=DELETE-ALL 二次确认。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 DELETE-ALL 以确认执行不可逆删除'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 二次确认
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DELETE-ALL" ]; then
            echo "未确认（输入为 '$CONFIRM'），终止删除。"
            exit 1
          fi
          echo "已确认，开始删除。"

      - name: 删除全部 Cloudflare 资源
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          # 列出并删除 Pages 项目
          echo "===== 删除 Pages 项目 ====="
          PAGES=$(curl -s -H "$H" "$API/accounts/$ACC/pages/projects")
          NAMES=$(echo "$PAGES" | python3 -c "
import sys, json
d = json.load(sys.stdin)
res = d.get('result')
if isinstance(res, dict): res = [res]
print('\n'.join(p.get('name','') for p in (res or []) if p.get('name')))
")
          if [ -z "$NAMES" ]; then
            echo "无 Pages 项目"
          else
            for n in $NAMES; do
              echo "--- 删除 Pages: $n ---"
              curl -s -X DELETE -H "$H" "$API/accounts/$ACC/pages/projects/$n" -w "  HTTP %{http_code}\n"
            done
          fi

          # 列出并删除 Workers 脚本
          echo "===== 删除 Workers 脚本 ====="
          SCRIPTS=$(curl -s -H "$H" "$API/accounts/$ACC/workers/scripts")
          IDS=$(echo "$SCRIPTS" | python3 -c "
import sys, json
d = json.load(sys.stdin)
print('\n'.join(s.get('id','') for s in (d.get('result') or []) if s.get('id')))
")
          if [ -z "$IDS" ]; then
            echo "无 Workers 脚本"
          else
            for i in $IDS; do
              echo "--- 删除 Worker: $i ---"
              curl -s -X DELETE -H "$H" "$API/accounts/$ACC/workers/scripts/$i" -w "  HTTP %{http_code}\n"
            done
          fi

          # 删除 KV 命名空间
          echo "===== 删除 KV 命名空间 ====="
          KV=$(curl -s -H "$H" "$API/accounts/$ACC/storage/kv/namespaces")
          KVIDS=$(echo "$KV" | python3 -c "
import sys, json
d = json.load(sys.stdin)
print('\n'.join(n.get('id','') for n in (d.get('result') or []) if n.get('id')))
")
          if [ -z "$KVIDS" ]; then
            echo "无 KV 命名空间"
          else
            for i in $KVIDS; do
              echo "--- 删除 KV: $i ---"
              curl -s -X DELETE -H "$H" "$API/accounts/$ACC/storage/kv/namespaces/$i" -w "  HTTP %{http_code}\n"
            done
          fi

          # 删除 R2 bucket
          echo "===== 删除 R2 bucket ====="
          R2=$(curl -s -H "$H" "$API/accounts/$ACC/r2/buckets")
          R2N=$(echo "$R2" | python3 -c "
import sys, json
d = json.load(sys.stdin)
print('\n'.join(b.get('name','') for b in ((d.get('result') or {}).get('buckets') or []) if b.get('name')))
")
          if [ -z "$R2N" ]; then
            echo "无 R2 bucket"
          else
            for b in $R2N; do
              echo "--- 删除 R2: $b ---"
              curl -s -X DELETE -H "$H" "$API/accounts/$ACC/r2/buckets/$b" -w "  HTTP %{http_code}\n"
            done
          fi

          # 删除 D1 数据库
          echo "===== 删除 D1 数据库 ====="
          D1=$(curl -s -H "$H" "$API/accounts/$ACC/d1/database")
          D1IDS=$(echo "$D1" | python3 -c "
import sys, json
d = json.load(sys.stdin)
print('\n'.join(x.get('uuid','') for x in (d.get('result') or []) if x.get('uuid')))
")
          if [ -z "$D1IDS" ]; then
            echo "无 D1 数据库"
          else
            for i in $D1IDS; do
              echo "--- 删除 D1: $i ---"
              curl -s -X DELETE -H "$H" "$API/accounts/$ACC/d1/database/$i" -w "  HTTP %{http_code}\n"
            done
          fi

          # 复查：确认已清空
          echo "===== 删除后复查 ====="
          echo "-- Pages --"
          curl -s -H "$H" "$API/accounts/$ACC/pages/projects" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result');r=[r] if isinstance(r,dict) else (r or []);print('剩余:',len(r),[p.get('name') for p in r])"
          echo "-- Workers --"
          curl -s -H "$H" "$API/accounts/$ACC/workers/scripts" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or [];print('剩余:',len(r),[s.get('id') for s in r])"
          echo "-- KV --"
          curl -s -H "$H" "$API/accounts/$ACC/storage/kv/namespaces" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or [];print('剩余:',len(r),[n.get('title') for n in r])"
          echo "-- R2 --"
          curl -s -H "$H" "$API/accounts/$ACC/r2/buckets" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=(d.get('result') or {}).get('buckets') or [];print('剩余:',len(r),[b.get('name') for b in r])"
          echo "-- D1 --"
          curl -s -H "$H" "$API/accounts/$ACC/d1/database" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or [];print('剩余:',len(r))"

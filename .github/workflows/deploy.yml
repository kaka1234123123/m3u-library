name: 部署（仅生成+发布，不采集）

# 适用于：本地/CI 已完成采集（media.db 已就绪），只需把当前数据重新生成并部署到 Cloudflare Pages。
# 手动在 Actions 页面 Run workflow 触发；也可被其他流程调用。
on:
  workflow_dispatch:
    inputs:
      REGEN_COVERS:
        description: '是否重新生成分类封面（耗时但修字体/封面问题时用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # 每日固定部署：北京时间 11:00（UTC 03:00）自动把当前 media.db 重新生成并部署到前端，
  # 与采集节奏解耦。原因：fast-collect 在稳定态(changed=false)会静默、其 cron 安全网常延迟，
  # 若「每天部署」仍挂在 fast-collect 的 03:00 窗口上会悄悄不触发（实测近 30 次采集 run 仅 1 次落在 :00/:30）。
  # 此处独立 cron 保证前端每天至少刷新一次，约 1 次/天 ≪ Cloudflare Pages 500 次/月额度。
  schedule:
    # 主 cron：北京时间 11:00（UTC 03:00）自动把当前 media.db 重新生成并部署到前端，
    # 与采集节奏解耦。原因：fast-collect 在稳定态(changed=false)会静默、其 cron 安全网常延迟，
    # 若「每天部署」仍挂在 fast-collect 的 03:00 窗口上会悄悄不触发（实测近 30 次采集 run 仅 1 次落在 :00/:30）。
    # 约 1 次/天 ≪ Cloudflare Pages 500 次/月额度。
    - cron: '0 3 * * *'
    # 兜底 cron：每 6 小时检查一次线上数据新鲜度，停了更久才补部署。
    # 存在的意义：scheduled run 会因仓库繁忙 / 并发组排队而延迟甚至整天不触发（实测 10-21 的
    # 部署因 Token 失效失败后，第二天整天没有任何 workflow 补上，线上数据停在 10-20）。
    # 与主 cron 错开（:17 分，避开整点高峰），且只在线上数据超过 6 小时未更新时才真正部署
    # （由「检查线上数据新鲜度」步骤判定），不额外消耗 Pages 构建额度。
    - cron: '17 */6 * * *'
  # 推送代码（非数据）变更时自动部署，使网页/worker 改动即时上线；
  # 仅 data/media.db 的数据推送（来自采集定时任务）不匹配 paths，不触发，避免重复部署。
  push:
    branches: [main]
    paths:
      - 'generator/**'
      - 'collector/**'
      - 'core/**'
      - 'scripts/**'
      - 'config.py'
      - 'main.py'
      - 'generate_movies_json.py'
      - 'output/_worker.js'
      - 'jellyfin/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

# 串行化：与「每日自动更新」共用并发组 m3u-collection，
# 避免本工作流（push 触发）与带库部署互相踩踏。
# 关键修复：此前本工作流既不在并发组、又缺少 db 下载步骤，
# push 代码时直接用空库（media.db 被 gitignore，全新检出为空）覆盖线上，
# 导致途播 Jellyfin 后端 / 网页数据被清空。现已从 Release 资产恢复 media.db 再生成。
concurrency:
  # 独立并发组（2026-10-22 改）：此前 fast-collect / update / deploy 三个工作流共用
  # 「m3u-collection」一个组，而 fast-collect 是自触发接力链（每轮结束派发下一轮，
  # 背靠背约 30 分钟一轮），几乎永远占着这个组 → update 与 deploy 长期排队，
  # 实测 10-21 的「每日自动更新」queued 超过 17 小时未执行，线上数据停在 10-20。
  # 拆分后：采集组只挡采集，部署组只挡部署，互不饿死。
  group: m3u-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90         # 硬上限: 部署卡死也会堵死采集(共用并发组), 超时自动释放
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 检查线上数据新鲜度（只在真的停更时才部署）
        id: fresh
        # 「线上停更」的自愈闸门：
        #   - 线上数据未超过 6 小时 → 跳过后面所有步骤（省 Actions 分钟 + Pages 构建额度）
        #   - 线上数据超过 6 小时 → 继续部署，把最新 media.db 发布上去
        # 触发源：每 6 小时一次的兜底 cron（见上面的 schedule）。
        # 手动触发（workflow_dispatch）与 push 触发时永远部署，不受此闸门限制 ——
        # 那是人明确要求的动作。
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "手动/push 触发 → 强制部署，跳过新鲜度闸门"
            exit 0
          fi
          # 退出码：0=新鲜(不部署) 1=过期(要部署) 2=检查失败(保守起见当作要部署)
          set +e
          python scripts/check_freshness.py --max-age-hours 6 --github-output
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "force=false" >> "$GITHUB_OUTPUT"
            echo "线上数据仍新鲜 → 本轮跳过部署"
          else
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "线上数据已过期或检查失败（rc=$RC）→ 本轮执行部署"
          fi

      - name: 恢复 media.db（从 Release 资产，绕过 git 100MB 限制）
        if: steps.fresh.outputs.force == 'true'
        # 关键修复：media.db 被 gitignore，全新检出为空。本工作流此前无此步，
        # 直接用空库 generate 并部署，把途播/网页数据清空。现先拉回生产库再生成。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --require-asset：Release 里没有库就直接失败，绝不拿空库去 deploy
        #（Pages 部署成功但内容为空 = 线上站点被清空，且不会回退到旧版本）。
        run: python scripts/db_store.py download --require-asset

      - name: 修正被采集站误标为电影的电视晚会（改判为综艺，幂等）
        if: steps.fresh.outputs.force == 'true'
        # 源站常把春节联欢晚会 / 跨年晚会 / 元宵喜乐会挂在电影类目下，导致电影墙前排
        # 混进大量晚会卡片。改 DB 而不是改生成代码 —— 这样 web / 途播 JSON / Jellyfin /
        # M3U / 增量 KV 全部下游自动一致。判定统一走 generator.m3u.is_tv_gala。
        run: python scripts/fix_gala_categories.py --apply

      - name: 生成 M3U / Web / 途播 Jellyfin 分片数据
        if: steps.fresh.outputs.force == 'true'
        env:
          WEB_STRICT_HEALTH: 1
        run: |
          python main.py generate --txt --best
          python generate_movies_json.py

      - name: 生成电影墙分类封面 + 直播台标
        if: steps.fresh.outputs.force == 'true'
        # 封面是部署产物的一部分（途播分类视图 + 直播频道台标均依赖），必须每次都生成，
        # 不可因 REGEN_COVERS=false 跳过，否则直播频道封面空白。
        run: |
          python -m pip install -q pillow
          python scripts/generate_covers.py

      - name: 生成直连分流规则（来自 media.db，自动覆盖新 CDN 子域）
        if: steps.fresh.outputs.force == 'true'
        # 手机开 VPN 访问 kaka-m3u.pages.dev 后端时，让国内视频 CDN 走直连。
        # 规则从 media.db 现抽现生成，源站换子域也能自动命中，不再手写维护。
        run: |
          python scripts/gen_direct_rules.py

      - name: 复制直连规则到站点（供 Shadowrocket/Clash 订阅，经 VPN 可达）
        if: steps.fresh.outputs.force == 'true'
        run: |
          cp scripts/shadowrocket_direct_rules.list output/
          cp scripts/shadowrocket_direct_module.conf output/
          cp scripts/direct_rules_clash.yaml output/

      - name: 递增 DATA_VERSION（避免客户端/途播缓存旧数据）
        if: steps.fresh.outputs.force == 'true'
        run: |
          VER="$(date +%Y%m%d%H)"
          sed -i "s/const DATA_VERSION = \".*\";/const DATA_VERSION = \"$VER\";/" output/_worker.js
          echo "DATA_VERSION -> $VER"
          grep "DATA_VERSION =" output/_worker.js

      - name: 生成 _headers（M3U Content-Type 修正 + 禁止缓存）
        if: steps.fresh.outputs.force == 'true'
        run: |
          cat > output/_headers <<'EOF'
          /movie.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /movie.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /live.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /live.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /*_full_part*.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /*_full_part*.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /shadowrocket_direct_module.conf
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /shadowrocket_direct_rules.list
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /direct_rules_clash.yaml
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /index.html
            Cache-Control: max-age=0, must-revalidate
          # 数据/简介分片文件名含内容哈希（generator/web.py _hash_write）→ 可放心 immutable：
          # 内容不变 URL 不变（浏览器零重下），内容变了 URL 必变（不会吃到旧缓存）
          /web/*
            Cache-Control: public, max-age=31536000, immutable
          EOF

      - name: 部署前体积闸门（Cloudflare Pages 单文件 25 MiB 硬上限）
        if: steps.fresh.outputs.force == 'true'
        # 超限会导致【整个部署失败 + 站点回退到上次成功部署（表现为内容为空）】，
        # 因此在部署前就点名超限文件并直接失败，避免只能靠 wrangler 报错倒推。
        run: python scripts/check_output_size.py output

      - name: 部署到 Cloudflare Pages（裸域名 kaka-m3u.pages.dev，由 main 分支提供）
        if: steps.fresh.outputs.force == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy output --project-name=kaka-m3u --branch=main
          npx --yes wrangler@4 pages deploy output --project-name=kaka-m3u --branch=production

      - name: 确保 KV 命名空间存在并注入 id
        if: steps.fresh.outputs.force == 'true'
        # 按标题 "m3u-delta" 幂等定位/创建 KV 命名空间，再把 id 注入
        # jellyfin/wrangler.toml 的 __KV_DELTA_ID__ 占位符。
        # 不硬编码 id：每个 CF 账号的命名空间 id 都不同，沿用上游写死的 id
        # 会把增量数据写进别人的命名空间。
        #
        # 取不到 id 时不阻塞 worker 部署：把 KV 绑定整段摘掉，worker 侧
        # deltaEnabled()=false 会自动降级为纯静态。客户端兼容修复照样上线，
        # 只是暂时没有「0 部署实时增量」这一层。
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NS_ID="$(python scripts/ensure_kv_namespace.py 2>&1 | tee /tmp/kv_out.txt | sed -n 's/^NS_ID=//p')"
          if [ -z "$NS_ID" ]; then
            echo "::warning::未能解析 KV 命名空间 id，将以无 KV 绑定方式部署 worker（降级为纯静态）"
            grep -E "ENSURE_KV" /tmp/kv_out.txt || true
            # 摘掉 kv_namespaces 段，避免把占位符当 id 提交给 wrangler
            python scripts/strip_kv_binding.py jellyfin/wrangler.toml
            echo "kv_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "kv_id=$NS_ID" >> "$GITHUB_OUTPUT"
          sed -i "s|__KV_DELTA_ID__|$NS_ID|g" jellyfin/wrangler.toml
          grep -A1 "kv_namespaces" jellyfin/wrangler.toml

      - name: 部署途播 Jellyfin Worker（含 KV_DELTA 实时增量合并）
        if: steps.fresh.outputs.force == 'true'
        # 独立的 Workers 服务（m3u-jellyfin），与 Pages 上的 _worker.js 是同一套
        # Jellyfin 兼容层的两份副本 —— 两处改动必须一起提交，否则行为不一致。
        # 该 worker 额外绑定 KV_DELTA：静态基库每 6h 才部署一次，而新片经 KV
        # 即时呈现，实现「0 部署、数据实时同步」。
        # 无 KV 绑定时 worker 侧 deltaEnabled()=false，自动降级纯静态。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config jellyfin/wrangler.toml

name: 一次性 · Cloudflare 资源盘点（详版）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 详细盘点
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ACC="$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          echo "===== PAGES 项目（原始 JSON）====="
          curl -s -H "$H" "$API/accounts/$ACC/pages/projects" \
            | python3 -c "
import sys, json
d = json.load(sys.stdin)
res = d.get('result')
if isinstance(res, dict):
    res = [res]
res = res or []
print('count =', len(res))
for p in res:
    print('  name        :', p.get('name'))
    print('  subdomain   :', p.get('subdomain'))
    print('  domains     :', [d.get('name') for d in (p.get('domains') or [])])
    print('  production_branch:', p.get('production_branch'))
    print('  created_on  :', p.get('created_on'))
    print('  source      :', (p.get('source') or {}).get('type'))
"

          echo "===== WORKERS 脚本 ====="
          curl -s -H "$H" "$API/accounts/$ACC/workers/scripts" \
            | python3 -c "
import sys, json
d = json.load(sys.stdin)
res = d.get('result') or []
print('count =', len(res))
for s in res:
    print('  id       :', s.get('id'))
    print('  modified :', s.get('modified_on'))
    print('  handlers :', [h.get('type') for h in (s.get('handlers') or [])])
"

          echo "===== workers.dev 子域开关 ====="
          curl -s -H "$H" "$API/accounts/$ACC/workers/subdomain" | head -c 400; echo

          echo "===== KV 命名空间 ====="
          curl -s -H "$H" "$API/accounts/$ACC/storage/kv/namespaces" \
            | python3 -c "
import sys, json
d = json.load(sys.stdin)
res = d.get('result') or []
print('count =', len(res))
for n in res:
    print('  -', n.get('title'), '|', n.get('id'))
"

name = "m3u-jellyfin"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# 实时增量层：每轮采集新增影片写入此 KV 命名空间，Worker 运行时读取并与静态基库合并。
#
# ⚠️ id 不再硬编码：不同 fork / 不同 Cloudflare 账号的命名空间 id 都不同，
#    沿用上游写死的 id 会把增量数据写进别人的命名空间。
#    改为由 CI 在部署前注入：scripts/ensure_kv_namespace.py 按标题 "m3u-delta"
#    幂等地确保命名空间存在（不存在则创建），并把 id 写回本文件。
#    本地手动部署前请先执行：
#      python scripts/ensure_kv_namespace.py --output-id-file /tmp/nsid
#      sed -i "s/__KV_DELTA_ID__/$(cat /tmp/nsid)/" jellyfin/wrangler.toml
[[kv_namespaces]]
binding = "KV_DELTA"
id = "__KV_DELTA_ID__"
